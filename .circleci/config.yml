version: 2.1

jobs:
  warmer_hotel:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Flush pipeline cache
          command: |
            mkdir -p /tmp/scratch
            set +o pipefail 2>/dev/null; yes abc | head -n 873444 | sha1sum > /tmp/scratch/step-18.txt; true
            echo "baseline emitted ($(wc -l </tmp/scratch/step-18.txt) lines)"
      - persist_to_workspace:
          root: /tmp/scratch
          paths:
            - step-18.txt
  hotel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/scratch
      - run:
          name: Collect upstream
          command: |
            { head -n 5 /tmp/scratch/step-18.txt > /dev/null; echo "lines ok" ; } || true
      - run:
          name: Clone upstream
          command: git clone --depth 1 -q --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Extract sources
          command: tar --extract --file=manifest.tar
      - run:
          name: Smoke check
          command: cat /proc/cpuinfo | head -5
      - run:
          command: free -m
      - run:
          no_output_timeout: 91m
          command: "$PWD/start"
  dispatch_UAT_STAGE_1:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/scratch
